[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "apl-sidecar"
version = "0.3.0"
description = "Local exposure control and signed receipts for sensitive AI tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-FSL-1.1-ALv2"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = ["cryptography", "PyYAML", "apl-verifier>=0.3.0,<0.4.0"]

[project.optional-dependencies]
dev = ["jsonschema", "pytest", "ruff==0.11.13"]

[project.scripts]
apl = "apl_sidecar.cli.apl:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["apl_sidecar*"]

[tool.setuptools.package-data]
"apl_sidecar.examples" = ["*/*"]
"apl_sidecar.app" = ["local_playground/*"]
"apl_sidecar.spec" = ["*.pem", "*.json", "*.md", "LICENSE"]

[tool.setuptools.exclude-package-data]
"apl_sidecar.examples" = ["*/receipt.local.json", "*/receipt.live.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

