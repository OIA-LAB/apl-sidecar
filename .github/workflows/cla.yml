name: CLA Assistant

# Runs only the CLA Assistant action. Deliberately does NOT check out or
# execute any code from the contributor's branch: pull_request_target runs
# with write permissions, so no PR code may run here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/OIA-LAB/apl-sidecar/blob/main/CLA.md
          path-to-signatures: .github/cla/signatures-v1.0.json
          branch: cla-signatures
          allowlist: yc-oia,YCC0988,*[bot]
